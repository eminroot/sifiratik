# Render blueprint. One web service: the API serves the built interface, so
# there is a single URL, no CORS to configure, and no API address compiled into
# the bundle.
#
# To deploy: push this repository to GitHub, then in Render choose
# New > Blueprint and point it at the repo. Render reads this file.
#
# The database is SQLite, seeded into the image at build time and therefore
# reset by every deploy. That is deliberate: each deploy serves a known-good
# demo. Decisions recorded against a running instance last until the next one.

services:
  - type: web
    name: gus-dedektiv
    runtime: docker
    # Closest Render region to Turkey.
    region: frankfurt
    # Legacy name for the 1c-2g plan: 1 CPU, 2 GB. Both spellings are valid.
    # Scoring peaks near 300 MB, so this leaves room for a re-run under load.
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # ---------------------------------------------------------------- gate
      # One shared sign-in in front of the whole site, so a public address is
      # not a public dataset. Both must be set or the site stays open; set
      # them in the Render dashboard, never in this file, which is public.
      #
      # The password is the only thing standing in front of the data, so make
      # it long and random rather than memorable:
      #   python -c "import secrets; print(secrets.token_urlsafe(18))"
      - key: SITE_USER
        sync: false
      - key: SITE_PASSWORD
        sync: false

      # Signs the session cookie. Render generates one and keeps it, so a
      # restart does not sign everybody out. Never set this by hand.
      - key: SESSION_SECRET
        generateValue: true

      # The cookie is sent only over HTTPS. Render serves nothing else, and
      # without this the session would travel in the open on any plain-http
      # request that reached the service.
      - key: SESSION_COOKIE_SECURE
        value: "true"

      # ------------------------------------------------------------- service
      # The delivered model. It falls back to the rule engine on its own if the
      # artefacts or lightgbm are missing, and every response says which ran.
      - key: SCORING_ENGINE
        value: ml

      # The image is built with the database already seeded, so this only
      # matters if that database is ever lost: the service would rebuild it
      # rather than come up empty.
      - key: AUTO_SEED
        value: "true"

      # Writing endpoints are OPEN unless this is set, which is what lets a
      # visitor record a decision without being handed a key. To close them,
      # set this in the Render dashboard as key:auditor pairs, comma separated:
      #   8f2c...:aydin.m,4b91...:kaya.s
      # Use a long random value, not a word:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      #
      # LEAVE THIS EMPTY unless you mean to close the gate. Anything that is
      # not key:user stops the service at startup rather than leaving the gate
      # open while it looks shut, so a placeholder like "x" or "change-me"
      # here is a service that will not boot. Blank, or a space, is fine.
      - key: API_KEYS
        sync: false

      # The in-app assistant. Without a key the endpoint reports itself
      # unconfigured and the interface hides the panel rather than failing.
      # Get one at https://aistudio.google.com/apikey
      #
      # Blank is a working answer; a placeholder is not. Any non-empty value
      # counts as configured, so the panel appears and then fails on the first
      # question. Either a real key or nothing.
      - key: GEMINI_API_KEY
        sync: false

      # Every assistant question is a paid call on the key above, so the
      # service caps them. Behind a proxy the container cannot tell one
      # anonymous viewer from another without trusting a header the caller
      # writes, so it does not try: this is the ceiling for all of them
      # together, not per person. Sized for a few people using the panel at
      # once. It is also the worst case on the bill, which is the point.
      - key: ASSISTANT_REQUESTS_PER_MINUTE
        value: "30"
