      content="600 firma, sekiz kanıt sinyali, her puanın yanında gerekçesi. TEKNOFEST 2026 Sıfır Atık ve Döngüsel Ekonomi — Takım KinetiX."

    <script>
      // Paint the stored theme before anything else, or a reload flashes white.
      (function () {
        try {
          var saved = localStorage.getItem('gus.theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
