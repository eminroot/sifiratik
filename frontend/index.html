    <!-- What a link to this page looks like when it is pasted somewhere. Without
         these a share in WhatsApp, Slack or Telegram is a bare blue URL, which

    <script>
      // Paint the theme before anything else, or a reload flashes the wrong one.
      //
      // Light unless this visitor has chosen dark here before. The phone's own
      // setting is deliberately not consulted: most phones are set to dark, and
      // the platform was designed light — a printed report, a screen behind a
      // desk, a projector in a room with the lights on. Whoever prefers dark
      // finds the switch in the dock and the choice sticks.
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('gus.theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
