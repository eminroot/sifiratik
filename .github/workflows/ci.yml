name: CI

# Jüri veya bir katkıcı depoyu klonladığında çalışan şey burada da çalışır:
# backend testleri gerçek panel ve gerçek model artefaktlarıyla koşar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıklar
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Arayüz derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci

      - name: Derle
        working-directory: frontend
        run: npm run build
