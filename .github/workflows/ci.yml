name: CI

# Jüri veya bir katkıcı depoyu klonladığında çalışan şey burada da çalışır:
# backend testleri gerçek panel ve gerçek model artefaktlarıyla koşar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Testler depoyu yalnızca okur; iş akışı jetonuna yazma yetkisi verilmez.
permissions:
  contents: read

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıklar
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Arayüz derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci

      - name: Derle
        working-directory: frontend
        run: npm run build

  docker:
    name: Dağıtım imajı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Render'ın derleyeceği imajın aynısı. Veritabanı derleme sırasında
      # tohumlanır, bu yüzden bu adım aynı zamanda panelin ve model
      # artefaktlarının depoda eksiksiz olduğunu da doğrular.
      - name: İmajı derle
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gus-dedektiv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ayağa kalkıyor ve cevap veriyor mu
        run: |
          set -euo pipefail
          docker run -d --name gus -p 8000:8000 -e PORT=8000 gus-dedektiv:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then echo "Servis açılmadı:"; docker logs gus; exit 1; fi
            sleep 2
          done

          echo "--- health"
          health=$(curl -fsS http://127.0.0.1:8000/api/health)
          echo "$health"
          # Tohumlanmış imajda model motoru hazır olmalı; kural motoruna
          # düşmüşse lightgbm ya da artefaktlar imaja girmemiş demektir.
          echo "$health" | grep -q '"engine":"ml"'

          echo "--- arayüz tek köken üzerinden servis ediliyor"
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root">'
          # Tarayıcı yönlendirmesindeki derin bağlantı da kabuğu almalı.
          curl -fsS http://127.0.0.1:8000/queue | grep -qi '<div id="root">'

          echo "--- API yolları arayüze düşmüyor"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/boyle-bir-yol-yok)" = "404"

          echo "--- veri tohumlanmış geldi"
          curl -fsS http://127.0.0.1:8000/api/dashboard >/dev/null
          curl -fsS "http://127.0.0.1:8000/api/inspection-queue?limit=1" >/dev/null

          docker rm -f gus >/dev/null
