version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "frontend"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
