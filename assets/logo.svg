<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">GÜS-DEDEKTİV</title>
  <desc id="d">Bir mercek içinde önceliğe göre sıralanmış denetim kuyruğu; en üstteki satır kritik önceliği gösterir.</desc>

  <!-- Mercek halkası: denetçinin baktığı yer. -->
  <circle cx="27" cy="27" r="19" fill="none" stroke="currentColor" stroke-width="4.5"/>

  <!-- Öncelik kuyruğu: uzunluk sırayı, renk yalnızca durumu anlatır. -->
  <g>
    <rect x="18" y="20" width="18" height="4" rx="2" fill="#e05252"/>
    <rect x="18" y="26" width="13" height="4" rx="2" fill="currentColor" opacity="0.75"/>
    <rect x="18" y="32" width="9"  height="4" rx="2" fill="currentColor" opacity="0.45"/>
  </g>

  <!-- Sap. -->
  <path d="M41 41 L54 54" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
</svg>
