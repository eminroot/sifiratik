<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { width: 512px; height: 512px; overflow: hidden; }
  .tile {
    width: 512px; height: 512px;
    background: #0a0a0b;
    border-radius: 112px;
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 3px #2b2b31;
  }
  svg { color: #f5f5f6; display: block; }
</style></head>
<body>
  <div class="tile">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320">
      <circle cx="27" cy="27" r="19" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <rect x="18" y="20" width="18" height="4" rx="2" fill="#f08a8a"/>
      <rect x="18" y="26" width="13" height="4" rx="2" fill="currentColor" opacity="0.75"/>
      <rect x="18" y="32" width="9"  height="4" rx="2" fill="currentColor" opacity="0.45"/>
      <path d="M41 41 L54 54" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
</body></html>
